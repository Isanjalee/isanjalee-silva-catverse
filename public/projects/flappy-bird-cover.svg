<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Flappy Bird Project Cover</title>
  <desc id="desc">Blue background with FlappyBird title and pixel bird icon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2bc6e9" />
      <stop offset="100%" stop-color="#13a9d1" />
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0a5066" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)" />

  <text
    x="600"
    y="280"
    text-anchor="middle"
    font-size="114"
    font-weight="900"
    font-family="'Press Start 2P', 'Courier New', monospace"
    letter-spacing="1.2"
    fill="#ffffff"
    stroke="#2e1a3c"
    stroke-width="8"
    paint-order="stroke fill"
    filter="url(#softShadow)"
  >
    FlappyBird
  </text>

  <g transform="translate(565 390) scale(3)">
    <rect x="0" y="8" width="8" height="8" fill="#2e1a3c" />
    <rect x="8" y="0" width="8" height="8" fill="#2e1a3c" />
    <rect x="16" y="0" width="8" height="8" fill="#2e1a3c" />
    <rect x="24" y="8" width="8" height="8" fill="#2e1a3c" />
    <rect x="32" y="16" width="8" height="8" fill="#2e1a3c" />
    <rect x="24" y="24" width="8" height="8" fill="#2e1a3c" />
    <rect x="16" y="24" width="8" height="8" fill="#2e1a3c" />
    <rect x="8" y="24" width="8" height="8" fill="#2e1a3c" />
    <rect x="0" y="16" width="8" height="8" fill="#2e1a3c" />

    <rect x="8" y="8" width="16" height="16" fill="#f9c80e" />
    <rect x="24" y="16" width="8" height="8" fill="#f97316" />
    <rect x="32" y="16" width="8" height="8" fill="#ef4444" />
    <rect x="40" y="16" width="8" height="8" fill="#f97316" />
    <rect x="16" y="8" width="8" height="8" fill="#f59e0b" />
    <rect x="8" y="16" width="8" height="8" fill="#fbbf24" />
    <rect x="8" y="0" width="8" height="8" fill="#fde68a" />
    <rect x="16" y="0" width="8" height="8" fill="#fef3c7" />

    <rect x="0" y="12" width="8" height="8" fill="#f8fafc" />
    <rect x="0" y="20" width="8" height="8" fill="#e2e8f0" />
    <rect x="24" y="8" width="8" height="8" fill="#f8fafc" />
    <rect x="28" y="8" width="4" height="8" fill="#1f2937" />
  </g>
</svg>
