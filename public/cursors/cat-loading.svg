<svg width="44" height="42" viewBox="0 0 44 42" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="catBody" x1="8" y1="10" x2="34" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8ec"/>
      <stop offset=".5" stop-color="#ddf8ce"/>
      <stop offset="1" stop-color="#8eeaf0"/>
    </linearGradient>
  </defs>
  <!-- Speed lines trailing behind the running cat -->
  <path d="M3.6 22.4h6.4M5 26.4h9.2M3 18.6h5.2" stroke="#22d3ee" stroke-width=".82" stroke-linecap="round" opacity=".74">
    <animate attributeName="opacity" values=".18;.78;.18" dur=".65s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;1.3 -1;0 0" dur=".42s" repeatCount="indefinite"/>
    <!-- Tail, base tucked under the body, curling up behind -->
    <path d="M10.6 25.6c-4-.4-6.7-3.3-4.7-6.1 1.9-2.6 5.2-1.7 4.6 1-.32 1.5-1.9 1.9-2.8 1" fill="none" stroke="#f59e0b" stroke-width="1.28" stroke-linecap="round"/>
    <!-- Body -->
    <path d="M8.4 25.2c.1-7.7 6.1-13.1 13.9-12.3 5.9.58 9.9 4.2 9.3 8.6-.66 4.3-6 7.3-12.6 7.3H9.6c-.66 0-1.18-.55-1.14-1.2l-.06-2.4Z" fill="url(#catBody)" stroke="#087889" stroke-width="1.05" stroke-linejoin="round"/>
    <!-- Ears -->
    <polygon points="24.6,13.6 22.6,7.4 29.4,10.8" fill="url(#catBody)" stroke="#087889" stroke-width="1.05" stroke-linejoin="round"/>
    <polygon points="31,12.4 33.6,6.6 36.8,11.4" fill="url(#catBody)" stroke="#087889" stroke-width="1.05" stroke-linejoin="round"/>
    <polygon points="24.9,12.4 23.7,8.8 27.5,10.8" fill="#ffe4ec"/>
    <polygon points="31.8,11.6 33.4,8.2 35.4,11.2" fill="#ffe4ec"/>
    <!-- Whiskers -->
    <path d="M28.6 19.6 34.4 18M28.9 21.2 35.4 21.2M28.5 22.8 34.2 24.2" stroke="#405057" stroke-width=".5" stroke-linecap="round" opacity=".8"/>
    <!-- Face -->
    <circle cx="32.2" cy="17.4" r="1.15" fill="#26333a"/>
    <polygon points="30.4,20.4 29.5,21.4 31.3,21.4" fill="#f7a8c4"/>
    <!-- Running legs -->
    <path d="M16.8 27.7l-2.52 3M24 26.75l2.2 3.05" stroke="#64748b" stroke-width=".8" stroke-linecap="round">
      <animate attributeName="opacity" values=".35;1;.35" dur=".42s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Signal ring -->
  <circle cx="34" cy="8.5" r="5" fill="none" stroke="#a78bfa" stroke-width=".72" stroke-dasharray="3 3">
    <animateTransform attributeName="transform" type="rotate" from="0 34 8.5" to="360 34 8.5" dur=".88s" repeatCount="indefinite"/>
  </circle>
</svg>
